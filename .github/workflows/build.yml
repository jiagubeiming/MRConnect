name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show env
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Check substrate header
        run: |
          set -euo pipefail
          wc -l inc/substrate.h
          grep -n "MSHookFunction" inc/substrate.h

      - name: Build dylibs
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          mkdir -p out
          CFLAGS="-arch arm64 -miphoneos-version-min=14.0 -isysroot $SDK -dynamiclib -O2 -fobjc-arc -Iinc"
          FW="-framework Foundation -framework UIKit -framework CoreFoundation"
          xcrun --sdk iphoneos clang++ $CFLAGS $FW -o out/MRNet.dylib MRNet.mm
          ls -la out/

      - name: Sign
        run: |
          set -euo pipefail
          if command -v ldid >/dev/null 2>&1; then
            ldid -S out/MRNet.dylib
          else
            curl -sL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64 -o /tmp/ldid || \
            curl -sL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_x86_64 -o /tmp/ldid
            chmod +x /tmp/ldid
            /tmp/ldid -S out/MRNet.dylib
          fi
          file out/*.dylib || true

      - uses: actions/upload-artifact@v4
        with:
          name: MRNet-dylib
          path: out/MRNet.dylib
